name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查密钥
        id: keys
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "缺少 CLOUDFLARE_API_TOKEN，跳过部署"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.keys.outputs.skip == 'false'
        with:
          node-version: '20'

      - name: 发布到 Cloudflare Pages
        if: steps.keys.outputs.skip == 'false'
        run: npx --yes wrangler@4 pages deploy web --project-name=sy-dusk --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 说明
        if: steps.keys.outputs.skip == 'true'
        run: echo "在仓库 Settings → Secrets and variables → Actions 里加上 CLOUDFLARE_API_TOKEN 和 CLOUDFLARE_ACCOUNT_ID 后，这里就会自动发布。"
