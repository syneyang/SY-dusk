name: Dusk
options:
  bundleIdPrefix: com.syneyang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  DuskCore:
    path: Packages/DuskCore

targets:
  Dusk:
    type: application
    platform: iOS
    sources:
      - path: Sources/DuskApp
    dependencies:
      - package: DuskCore
        product: DuskCore
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 朝夕
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHumanReadableCopyright: "© 2026 syneyang"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syneyang.dusk
        PRODUCT_NAME: Dusk
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  Dusk:
    build:
      targets:
        Dusk: all
    run:
      config: Debug
    archive:
      config: Release
